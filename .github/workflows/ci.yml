name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit --project tsconfig.test.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Playwright (download)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright (deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run e2e:seed
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    needs: [unit, e2e, migrations]
    if: always()
    steps:
      - name: Falha se algum job não passou
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.migrations.result }}" != "success" ]; then
            echo "unit=${{ needs.unit.result }} e2e=${{ needs.e2e.result }} migrations=${{ needs.migrations.result }}"
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Nomes e rollbacks das migrations
        run: scripts/check-migrations.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: npx prisma db push --skip-generate
      - name: Aplica todas as migrations em ordem (2x, falha em erro)
        run: scripts/ci-apply-migrations.sh
